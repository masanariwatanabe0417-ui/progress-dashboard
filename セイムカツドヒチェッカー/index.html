<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>セイムカツドヒチェッカー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #333;
      padding: 24px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 24px; }
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
      padding: 20px;
      margin-bottom: 16px;
    }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    textarea, input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      resize: vertical;
    }
    textarea { min-height: 100px; }
    .row { display: flex; gap: 12px; }
    .row > * { flex: 1; }
    button {
      margin-top: 16px;
      padding: 10px 24px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:disabled { background: #a5a5a5; cursor: not-allowed; }
    #result {
      margin-top: 16px;
      padding: 14px;
      border-radius: 6px;
      white-space: pre-wrap;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .result-same    { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }
    .result-diff    { background: #f0fdf4; border: 1px solid #86efac; color: #166534; }
    .result-error   { background: #fff7ed; border: 1px solid #fdba74; color: #9a3412; }
    .result-loading { background: #eff6ff; border: 1px solid #93c5fd; color: #1e40af; }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
      margin-bottom: 8px;
    }
    .badge-same { background: #fca5a5; color: #7f1d1d; }
    .badge-diff { background: #86efac; color: #14532d; }
  </style>
</head>
<body>
  <h1>セイムカツドヒチェッカー</h1>

  <div class="card">
    <label for="apiKey">Anthropic API キー</label>
    <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off">
  </div>

  <div class="card">
    <div class="row">
      <div>
        <label for="activity1">カツドヒ 1</label>
        <textarea id="activity1" placeholder="例: 朝のジョギング 30分"></textarea>
      </div>
      <div>
        <label for="activity2">カツドヒ 2</label>
        <textarea id="activity2" placeholder="例: ランニング 3km"></textarea>
      </div>
    </div>
    <label for="context" style="margin-top:12px;">追加コンテキスト（任意）</label>
    <input type="text" id="context" placeholder="判定の参考にする情報があれば入力">
    <button id="checkBtn" onclick="checkActivities()">チェックする</button>
  </div>

  <div id="result" style="display:none;"></div>

  <script>
    function filterEmptyTextBlocks(messages) {
      return messages
        .map(msg => {
          if (!Array.isArray(msg.content)) return msg;
          const filtered = msg.content.filter(
            block => !(block.type === 'text' && block.text.trim() === '')
          );
          return { ...msg, content: filtered };
        })
        .filter(msg => {
          if (Array.isArray(msg.content)) return msg.content.length > 0;
          if (typeof msg.content === 'string') return msg.content.trim() !== '';
          return true;
        });
    }

    async function checkActivities() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const activity1 = document.getElementById('activity1').value.trim();
      const activity2 = document.getElementById('activity2').value.trim();
      const context  = document.getElementById('context').value.trim();

      const resultEl = document.getElementById('result');
      const btn = document.getElementById('checkBtn');

      if (!apiKey) {
        showResult('error', 'API キーを入力してください。');
        return;
      }
      if (!activity1 || !activity2) {
        showResult('error', '両方のカツドヒを入力してください。');
        return;
      }

      btn.disabled = true;
      showResult('loading', '判定中...');

      const systemPrompt = `あなたは活動記録の重複を判定するアシスタントです。
2つの活動が本質的に同じかどうかを判断してください。
表現が違っても内容が同じであれば「同じ」と判定してください。
回答は必ず JSON 形式で返してください: {"same": true/false, "reason": "理由"}`;

      const userContent = [
        {
          type: 'text',
          text: `以下の2つの活動が同じかどうか判定してください。\n\n活動1: ${activity1}\n活動2: ${activity2}`
        },
        {
          type: 'text',
          text: context ? `追加コンテキスト: ${context}` : ''
        }
      ];

      const rawMessages = [
        { role: 'user', content: userContent }
      ];

      const messages = filterEmptyTextBlocks(rawMessages);

      try {
        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: 'claude-haiku-4-5-20251001',
            max_tokens: 256,
            system: systemPrompt,
            messages
          })
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({ error: { message: response.statusText } }));
          throw new Error(err?.error?.message ?? response.statusText);
        }

        const data = await response.json();
        const raw = data.content?.[0]?.text ?? '';
        const jsonMatch = raw.match(/\{[\s\S]*\}/);
        if (!jsonMatch) throw new Error('レスポンスを解析できませんでした。');

        const parsed = JSON.parse(jsonMatch[0]);
        const isSame = parsed.same === true;
        showResult(isSame ? 'same' : 'diff', parsed.reason ?? '', isSame);
      } catch (e) {
        showResult('error', `エラー: ${e.message}`);
      } finally {
        btn.disabled = false;
      }
    }

    function showResult(type, message, isSame) {
      const el = document.getElementById('result');
      el.className = 'result-' + type;
      el.style.display = 'block';

      if (type === 'same' || type === 'diff') {
        const badge = `<span class="badge badge-${type}">${isSame ? '同じ活動' : '異なる活動'}</span>\n`;
        el.innerHTML = badge + escapeHtml(message);
      } else {
        el.textContent = message;
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
